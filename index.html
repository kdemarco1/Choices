<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hollow House</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="app">

    <!-- Title screen -->
    <section id="screen-title" class="screen">
      <div class="frame frame-title">
        <h1 class="title-flicker">HOLLOW HOUSE</h1>
        <p class="subtitle">Something in Mara's letters stopped making sense a month ago. Tonight she goes to find out why.</p>
        <button id="title-start-button" class="primary-button">Start</button>
        <button id="title-settings-button" class="secondary-button">Settings</button>
      </div>
    </section>

    <!-- Settings screen -->
    <section id="screen-settings" class="screen hidden">
      <div class="frame">
        <h1>Settings</h1>

        <label class="label">Controls</label>
        <p class="settings-text">W/S or ↑/↓ to move. A/D or ←/→ to turn. Press E to interact.</p>

        <label class="label" for="toggle-prompts">On-screen interact prompts</label>
        <button id="toggle-prompts" class="toggle-button"></button>

        <button id="settings-back-button" class="secondary-button" style="margin-top: 24px;">Back</button>
      </div>
    </section>

    <!-- Explore screen (first-person raycast view) -->
    <section id="screen-explore" class="screen hidden">
      <div class="frame">
        <div id="hud" class="hud"></div>

        <div class="viewport-wrap">
          <canvas id="viewport" width="400" height="260"></canvas>
          <div id="interact-prompt" class="interact-prompt hidden"></div>
        </div>
        <p class="hint">W/S or ↑/↓ to move. A/D or ←/→ to turn. Press E to interact.</p>

        <div class="log-panel">
          <div class="log-title">Log</div>
          <div id="log-list"></div>
        </div>

        <div id="dialogue-overlay" class="overlay hidden">
          <div class="dialogue-box">
            <div id="dialogue-speaker" class="speaker"></div>
            <div id="dialogue-text" class="dialogue-text"></div>
            <div id="dialogue-choices" class="choice-list"></div>
            <button id="dialogue-exit" class="exit-button">Step back (Esc)</button>
          </div>
        </div>
      </div>
    </section>

  </div>

  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
